name: Instagram public accounts to RSS
on:
  push:
    paths:
      - 'instagram-rss/**'
      - '.github/workflows/instagram-rss.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 */4 * * *'
permissions:
  contents: write
concurrency:
  group: instagram-rss-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector
        run: python -m pip install -r instagram-rss/requirements.txt
      - name: Install Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Collect public posts and optional authenticated stories
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_SESSION_BASE64: ${{ secrets.INSTAGRAM_SESSION_BASE64 }}
        run: python instagram-rss/collect.py
      - name: Collect through rendered Chromium pages
        run: python instagram-rss/browser_collect.py
      - name: Commit feed and status only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-rss/docs/rss.xml instagram-rss/docs/status.json instagram-rss/docs/browser_status.json instagram-rss/data/items.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh Instagram RSS"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
